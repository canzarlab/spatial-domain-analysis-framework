name: scTM
channels:
  - conda-forge
  - bioconda
dependencies:
  # sctm's PyPI build backend needs setuptools >= 77, which requires Python >= 3.9.
  - python=3.10
  - pip
  - pytorch>2.0.1
  - scanpy>1.9
  # squidpy imports SparseCSCView/SparseCSRView, removed in anndata 0.11.
  - anndata<0.11
  - squidpy>1.2.2
  # sctm still uses np.Inf etc., removed in NumPy 2.0.
  - numpy<2
  - pandas
  - scikit-learn
  - numba
  - scikit-misc>0.2
  - pyro-ppl>1.8
  - r-mclust
  - torchinfo>=1.8.0
  - gseapy>1.0
  - rpy2=3.5
  - pip:
    - discotoolkit
    # - sctm --no-deps
